<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI PROJECT</title>
    <link rel="stylesheet" href="mini.css">
</head>
<body>

    <h1>GYM CENTER MEMBERSHIP</h1>
    <form>

    <label>Full Name:</label><br>
    <input type="text" name="fullname"><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea><br><br>

    <label>Membership Plan:</label><br>
    <select name="plan">
        <option>Select Plan</option>
        <option>1 Month</option>
        <option>3 Months</option>
        <option>6 Months</option>
        <option>12 Months</option>
    </select><br><br>

    <label>Preferred Workout Time:</label><br>
    <select name="time">
        <option>Morning</option>
        <option>Afternoon</option>
        <option>Evening</option>
    </select><br><br>

    <label>Height (cm):</label><br>
    <input type="number" name="height"><br><br>

    <label>Weight (kg):</label><br>
    <input type="number" name="weight"><br><br>

    <label>Medical Conditions:</label><br>
    <textarea name="medical" rows="4" cols="30"></textarea><br><br>

    <label>Emergency Contact Number:</label><br>
    <input type="tel" name="emergency"><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

</body>
</html>
