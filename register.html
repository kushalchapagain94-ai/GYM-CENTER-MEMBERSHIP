<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="container">
<h1>User Registration</h1>
<form action="backend/register.php" method="post">
<label>Username</label><input name="username" required>
<label>Password</label><input type="password" name="password" minlength="6" required>
<label>Full Name</label><input name="name" required>
<label>Date of Birth</label><input type="date" name="dob" required>
<label>Gender</label>
<select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
<label>Phone</label><input name="phone">
<label>Email</label><input type="email" name="email">
<label>Address</label><input name="address">
<button type="submit">Register</button>
</form>
</div>
</body></html>
